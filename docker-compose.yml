# Portfolio X-ray (ETF look-through)
#
#   docker compose up -d --build
#
# Open http://<this-machine>:8097 (host 8096 is avoided: it is Jellyfin's default). Change the published port with HOST_PORT.
# Holdings you enter stay in your browser (localStorage). Optional pre-scraped ETF holdings live in the
# portfolio-x-ray-data volume at /data/lookthru/holdings.json (see README).

services:
  portfolio-x-ray:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-x-ray:latest
    container_name: portfolio-x-ray
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8097}:8096"
    environment:
      PORT: "8096"
      HOST: "0.0.0.0"
      NITRO_HOST: "0.0.0.0"
      TZ: ${TZ:-America/Toronto}
      LOOKTHRU_HOLDINGS_FILE: ${LOOKTHRU_HOLDINGS_FILE:-/data/lookthru/holdings.json}
      LOOKTHRU_TICKERS_FILE: ${LOOKTHRU_TICKERS_FILE:-/data/lookthru/tickers.json}
      PRICES_DB_FILE: ${PRICES_DB_FILE:-/data/lookthru/prices.sqlite}
      PRICES_PREFETCH: ${PRICES_PREFETCH:-1}
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.86.35:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      SEARCH_URL: ${SEARCH_URL:-http://192.168.86.35:8099}
      SEARCH_ENGINE: ${SEARCH_ENGINE:-searxng}
    volumes:
      - portfolio-x-ray-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  portfolio-x-ray-data:
